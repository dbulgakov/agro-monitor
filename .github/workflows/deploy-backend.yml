name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 'Setup Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Install dependencies'
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          # No need to deactivate, runner environment is ephemeral

      - name: 'Package function app for deployment'
        run: |
          cd backend
          zip -r ../backend.zip . -x ".git*" -x ".idea*" -x ".vscode*" -x "__pycache__/*" -x ".venv/*" -x "venv/*" -x "local.settings.json" -x "*.pyc" -x "*.pyo" -x ".pytest_cache/*" -x "tests/*" -x "pytest.ini" -x ".DS_Store"
          cd ..
          echo "Created backend.zip for deployment"

      - name: 'Login via Azure CLI'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Mimic frontend approach: Ensure Run From Package is off (0), Use SCM is on (true)
      # Note: WEBSITE_RUN_FROM_PACKAGE=1 is generally recommended for Python Functions zip deploy for performance.
      - name: 'Configure App Settings for Zip Deploy (SCM)'
        run: |
          az functionapp config appsettings set --name ${{ secrets.FUNC_API_APP_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} --settings WEBSITE_WEBDEPLOY_USE_SCM=true WEBSITE_RUN_FROM_PACKAGE=0

      - name: 'Deploy to Azure Function App'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.FUNC_API_APP_NAME }}
          package: backend.zip # Path to the zip file created in the previous step
          publish-profile: ${{ secrets.FUNC_API_PUBLISH_PROFILE }}

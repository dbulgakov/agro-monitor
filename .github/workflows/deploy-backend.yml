name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 'Login via Azure CLI'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Set up Azure Functions Core Tools'
        uses: Azure/functions-action@v1
        with:
          package: backend
          # Optional: Specify the version of Azure Functions Core Tools
          # version: '<version>'

      - name: 'Deploy to Azure Functions'
        run: |
          cd backend # Ensure we are in the correct directory
          func azure functionapp publish ${{ secrets.FUNC_API_APP_NAME }} --python
        env:
          FUNC_API_APP_NAME: ${{ secrets.FUNC_API_APP_NAME }}
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}

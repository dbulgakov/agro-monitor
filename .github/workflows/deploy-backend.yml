name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: 'Login via Azure CLI'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Zip artifact for deployment'
        run: zip -r ../deploy.zip .
        working-directory: backend # Zip contents of backend dir

      - name: 'Run Azure Functions deployment'
        run: |
          az functionapp deployment source config-zip --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} --name ${{ secrets.FUNC_API_APP_NAME }} --src ../deploy.zip
        env:
          FUNC_API_APP_NAME: ${{ secrets.FUNC_API_APP_NAME }}
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}

name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies and build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.BACKEND_API_URL }}
        run: |
          npm ci --legacy-peer-deps
          echo "Building frontend with API URL: $NEXT_PUBLIC_API_URL"
          npm run build

      - name: Prepare standalone package with dependencies
        run: |
          cp package.json .next/standalone/
          cp package-lock.json .next/standalone/
          cp -R node_modules .next/standalone/

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set WEBSITE_WEBDEPLOY_USE_SCM to true
        run: |
          az webapp config appsettings set --name ${{ secrets.FRONTEND_WEBAPP_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP_NAME }} --settings WEBSITE_WEBDEPLOY_USE_SCM=true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.FRONTEND_WEBAPP_NAME }}
          package: frontend/.next/standalone
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
